# Publica a pasta site/ (página inicial e política de privacidade) no GitHub Pages, com a
# ajuda (site/ajuda/) gerada da wiki/ por scripts/wiki-site.py.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", "wiki/**", "scripts/wiki-site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gerar a ajuda a partir da wiki
        run: |
          pip install --quiet markdown==3.5.2
          python3 scripts/wiki-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
