# Instalador do Windows (NSIS, com o GStreamer embutido).
# Tag v*: anexa o .exe à Release do tag (cria a Release se ainda não existir).
# "Run workflow" (manual): só gera o .exe como artefato, para teste.
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GST_VERSAO: "1.28.8"
  GST_DIR: C:\gstreamer\msvc_x86_64

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Baixar o GStreamer (MSVC x86_64)
        id: gst-cache
        uses: actions/cache@v4
        with:
          path: gst-instalador.exe
          key: gstreamer-msvc-x86_64-${{ env.GST_VERSAO }}

      - name: Download do instalador do GStreamer
        if: steps.gst-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSAO/msvc"
          $nome = "gstreamer-1.0-msvc-x86_64-$env:GST_VERSAO.exe"
          Invoke-WebRequest "$base/$nome" -OutFile gst-instalador.exe
          $txt = (Invoke-WebRequest "$base/$nome.sha256sum").Content
          if ($txt -is [byte[]]) { $txt = [Text.Encoding]::ASCII.GetString($txt) }
          $esperado = ($txt.Trim() -split '\s+')[0]
          $obtido = (Get-FileHash gst-instalador.exe -Algorithm SHA256).Hash
          if ($obtido -ne $esperado) { throw "SHA-256 não confere: $obtido <> $esperado" }

      - name: Instalar o GStreamer
        shell: pwsh
        run: |
          $p = Start-Process gst-instalador.exe -Wait -PassThru -ArgumentList @(
            '/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TYPE=full', "/DIR=$env:GST_DIR", '/LOG=gst-instalacao.log')
          if ($p.ExitCode -ne 0) { Get-Content gst-instalacao.log -Tail 40; throw "Instalador do GStreamer saiu com $($p.ExitCode)" }
          foreach ($f in 'bin\gstreamer-1.0-0.dll', 'bin\pkg-config.exe', 'lib\pkgconfig\gstreamer-1.0.pc', 'include\gstreamer-1.0') {
            if (-not (Test-Path (Join-Path $env:GST_DIR $f))) {
              Get-ChildItem $env:GST_DIR -Depth 1 | Select-Object FullName
              throw "Faltou $f na instalação do GStreamer"
            }
          }
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$env:GST_DIR\" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$env:GST_DIR\lib\pkgconfig" >> $env:GITHUB_ENV
          "$env:GST_DIR\bin" >> $env:GITHUB_PATH

      - run: npm ci

      - name: Gerar o instalador
        env:
          # Credenciais do OAuth do Google (sincronização pelo Drive); sem elas o cartão diz "Indisponível".
          SKALD_GOOGLE_CLIENT_ID: ${{ secrets.SKALD_GOOGLE_CLIENT_ID }}
          SKALD_GOOGLE_CLIENT_SECRET: ${{ secrets.SKALD_GOOGLE_CLIENT_SECRET }}
        run: npm run build:windows

      - name: Localizar o .exe
        id: exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "Instalador não gerado" }
          "caminho=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "nome=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.exe.outputs.nome }}
          path: ${{ steps.exe.outputs.caminho }}

    outputs:
      nome: ${{ steps.exe.outputs.nome }}

  # Máquina nova, sem GStreamer, Rust ou Node: instala o .exe e abre o Skáld.
  teste-limpo:
    needs: instalador
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.instalador.outputs.nome }}

      - name: Sem GStreamer no sistema
        shell: pwsh
        run: |
          if (Get-Command gst-launch-1.0.exe -ErrorAction SilentlyContinue) { throw "Esta máquina já tem GStreamer" }
          if ($env:GSTREAMER_1_0_ROOT_MSVC_X86_64) { throw "GSTREAMER_1_0_ROOT_MSVC_X86_64 definido" }

      - name: Instalar, abrir e conferir
        shell: pwsh
        run: |
          $setup = Get-ChildItem *-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Instalador saiu com $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Skald\skald.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem $env:LOCALAPPDATA -Depth 1 | Select-Object FullName; throw "skald.exe não instalado" }
          Get-ChildItem (Split-Path $exe) | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          $app = Start-Process $exe -PassThru
          Start-Sleep 25
          $app.Refresh()
          if ($app.HasExited) { throw ("O Skáld fechou sozinho (código 0x{0:X})" -f $app.ExitCode) }
          $banco = Join-Path $env:APPDATA 'com.skald.app\skald.db'
          $registro = Join-Path $env:LOCALAPPDATA 'com.skald.app\gstreamer-registry.bin'
          if (-not (Test-Path $banco)) { throw "Banco não criado em $banco" }
          if (-not (Test-Path $registro)) { throw "GStreamer embutido não iniciou (sem $registro)" }
          $kb = [math]::Round((Get-Item $registro).Length / 1KB)
          Write-Host "Banco: ok. Registro do GStreamer embutido: $kb KB."
          if ($kb -lt 50) { throw "Registro do GStreamer pequeno demais ($kb KB): plugins não carregaram" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $tela = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $tela.Width, $tela.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($tela.Location, [System.Drawing.Point]::Empty, $tela.Size)
          $bmp.Save("$PWD\skald-limpo.png")
          Stop-Process -Id $app.Id

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tela-windows-limpo
          path: skald-limpo.png
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [instalador, teste-limpo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.instalador.outputs.nome }}

      - name: Anexar à Release do tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Skáld $tag"
          # Notas com a marca "windows-em-breve": o instalador fica só como artefato desta
          # execução (para testar). Depois de testado: tirar a marca das notas e rodar de novo
          # este job (gh run rerun <id> --job <id do job release>).
          if gh release view "$tag" --json body -q .body | grep -q 'windows-em-breve'; then
            echo "Windows marcado como em breve nesta release: o .exe não foi anexado."
            exit 0
          fi
          gh release upload "$tag" ./*-setup.exe --clobber
