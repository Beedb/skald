# Instalador do Windows (NSIS, com o GStreamer embutido).
# Tag v*: anexa o .exe à Release do tag (cria a Release se ainda não existir).
# "Run workflow" (manual): só gera o .exe como artefato, para teste.
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GST_VERSAO: "1.28.8"
  GST_DIR: C:\gstreamer\msvc_x86_64

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Baixar o GStreamer (MSVC x86_64)
        id: gst-cache
        uses: actions/cache@v4
        with:
          path: gst-instalador.exe
          key: gstreamer-msvc-x86_64-${{ env.GST_VERSAO }}

      - name: Download do instalador do GStreamer
        if: steps.gst-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSAO/msvc"
          $nome = "gstreamer-1.0-msvc-x86_64-$env:GST_VERSAO.exe"
          Invoke-WebRequest "$base/$nome" -OutFile gst-instalador.exe
          $txt = (Invoke-WebRequest "$base/$nome.sha256sum").Content
          if ($txt -is [byte[]]) { $txt = [Text.Encoding]::ASCII.GetString($txt) }
          $esperado = ($txt.Trim() -split '\s+')[0]
          $obtido = (Get-FileHash gst-instalador.exe -Algorithm SHA256).Hash
          if ($obtido -ne $esperado) { throw "SHA-256 não confere: $obtido <> $esperado" }

      - name: Instalar o GStreamer
        shell: pwsh
        run: |
          $p = Start-Process gst-instalador.exe -Wait -PassThru -ArgumentList @(
            '/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TYPE=full', "/DIR=$env:GST_DIR", '/LOG=gst-instalacao.log')
          if ($p.ExitCode -ne 0) { Get-Content gst-instalacao.log -Tail 40; throw "Instalador do GStreamer saiu com $($p.ExitCode)" }
          foreach ($f in 'bin\gstreamer-1.0-0.dll', 'bin\pkg-config.exe', 'lib\pkgconfig\gstreamer-1.0.pc', 'include\gstreamer-1.0') {
            if (-not (Test-Path (Join-Path $env:GST_DIR $f))) {
              Get-ChildItem $env:GST_DIR -Depth 1 | Select-Object FullName
              throw "Faltou $f na instalação do GStreamer"
            }
          }
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$env:GST_DIR\" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$env:GST_DIR\lib\pkgconfig" >> $env:GITHUB_ENV
          "$env:GST_DIR\bin" >> $env:GITHUB_PATH

      - run: npm ci

      - name: Gerar o instalador
        run: npm run build:windows

      - name: Localizar o .exe
        id: exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "Instalador não gerado" }
          "caminho=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "nome=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.exe.outputs.nome }}
          path: ${{ steps.exe.outputs.caminho }}

      - name: Anexar à Release do tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --notes "Skáld $tag" }
          gh release upload $tag "${{ steps.exe.outputs.caminho }}" --clobber
