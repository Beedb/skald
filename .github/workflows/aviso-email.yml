# Aviso de nova versão por e-mail (Buttondown).
# Release publicada: cria um RASCUNHO no Buttondown com as notas da release.
# Nada é enviado daqui: o rascunho é conferido e enviado à mão no Buttondown
# (a chave BUTTONDOWN_API_KEY não tem permissão de envio).
# A linha da release com o link de inscrição (buttondown.com/skald) não entra no e-mail.
# Notas com a marca "<!-- windows-em-breve -->": o e-mail diz que o Windows sai em breve e
# não traz o link do .exe.
# Os links de download seguem os nomes dos arquivos da release (.exe e .apk são anexados depois:
# enviar o rascunho só quando os quatro estiverem lá).
# Também gera no resumo da execução um link do WhatsApp com a nota (scripts/aviso-whatsapp.sh).
# "Run workflow" (manual): cria um rascunho de teste a partir de uma tag existente.
name: Aviso por e-mail

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v0.2.0)"
        required: true
      teste:
        description: "Marcar o assunto como [TESTE]"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  rascunho:
    runs-on: ubuntu-latest
    steps:
      - name: Criar rascunho no Buttondown
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          TESTE: ${{ inputs.teste && '[TESTE] ' || '' }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body,url > release.json
          versao="${TAG#v}"
          jq -n \
            --arg assunto "${TESTE}Skáld ${versao}: nova versão" \
            --arg versao "$versao" \
            --arg base "https://github.com/${GH_REPO}/releases/download/${TAG}" \
            --slurpfile r release.json \
            '{
              subject: $assunto,
              status: "draft",
              body: ("Saiu a versão **" + $versao + "** do Skáld, o reprodutor de música local e offline.\n\n"
                + ($r[0].body | split("\n") | map(select(test("buttondown.com/skald") | not) | sub(" *<!-- windows-em-breve -->"; "")) | join("\n"))
                + "\n\n## Baixar a versão " + $versao + "\n\n"
                + (if ($r[0].body | test("windows-em-breve")) then ""
                   else "- **[Windows 10 ou mais novo (.exe)](" + $base + "/Skald_" + $versao + "_x64-setup.exe)**\n" end)
                + "- **[Linux: Debian, Ubuntu, Zorin, Mint (.deb)](" + $base + "/Skald_" + $versao + "_amd64.deb)**\n"
                + "- **[Linux: Fedora (.rpm)](" + $base + "/Skald-" + $versao + "-1.x86_64.rpm)**\n"
                + "- **[Android (.apk)](" + $base + "/skald-" + $versao + "-android-arm64.apk)**\n"
                + (if ($r[0].body | test("windows-em-breve")) then "- Windows: em breve\n" else "" end) + "\n"
                + "Também pelo site: [beedb.github.io/skald](https://beedb.github.io/skald/#baixar) · "
                + "[notas completas no GitHub](" + $r[0].url + ")\n")
            }' > email.json
          resposta=$(curl -sS -w '\n%{http_code}' -X POST https://api.buttondown.com/v1/emails \
            -H "Authorization: Token ${BUTTONDOWN_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @email.json)
          codigo=$(tail -n1 <<< "$resposta")
          corpo=$(sed '$d' <<< "$resposta")
          if [ "$codigo" -ge 300 ]; then
            echo "Buttondown respondeu $codigo:"; echo "$corpo"; exit 1
          fi
          echo "Rascunho criado: $(jq -r '.subject + " (" + .status + ")"' <<< "$corpo")"

      - name: Nota para o WhatsApp
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/contents/scripts/aviso-whatsapp.sh?ref=${TAG}" -q .content 2>/dev/null | base64 -d > aviso.sh \
            || gh api "repos/${GH_REPO}/contents/scripts/aviso-whatsapp.sh" -q .content | base64 -d > aviso.sh
          texto=$(SO_TEXTO=1 bash aviso.sh "$TAG")
          url="https://wa.me/?text=$(jq -rn --arg t "$texto" '$t|@uri')"
          {
            echo "## Nota para o WhatsApp"
            echo
            echo "[Abrir no WhatsApp]($url) (escolha os contatos e envie)"
            echo
            echo '```'
            echo "$texto"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
