[package]
name = "skald"
version = "0.3.0"
description = "Reprodutor de áudio local para Linux"
authors = ["Ded"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "skald_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
rusqlite = { version = "0.37", features = ["bundled", "collation", "functions", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25.5"
walkdir = "2.5.0"
tauri-plugin-dialog = "2"
gstreamer = "0.25.4"
base64 = "0.23.1"
unicode-normalization = "0.1.26"
fastrand = "2.5.0"
notify = "8.2.2"
blake3 = { version = "1.8.7", features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
ureq = "3"
sha2 = "0.10"
getrandom = "0.3"
form_urlencoded = "1"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
roxmltree = "0.21.2"

# Só no desktop: notificações (D-Bus/Windows), MPRIS (Linux, via zbus) e SMTC (Windows).
# No Android isso virá com o serviço de mídia.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
notify-rust = "4"
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }

# Android: notificação de mídia via JNI (MidiaService.kt).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# Iniciar com o sistema no Windows (HKCU\...\Run).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
